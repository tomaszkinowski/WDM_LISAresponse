[project]
name = "WDM_LISAresponse"
version = "0.0.1"
authors = [ { name="Tomasz Kinowski", email="tk593@cam.ac.uk"},
  { name="Christopher J. Moore", email="cjm96@cam.ac.uk"},
]
description = "A fast, JAX-based Python implementation for computing LISA detector response functions using the Wilson-Daubechies-Meyer (WDM) wavelet framework."
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.11"
dependencies = [
    # Distribution name, not the import name: this installs as
    # WDM-GW-wavelets and imports as WDM. Naming it "WDM" here resolves only
    # on a machine where it already happens to be installed, and fails on a
    # clean one - there is no distribution by that name.
    "WDM_GW_wavelets",
    "numpy",
    "scipy",
    "jax",
    "lisaconstants",
    "lisaorbits",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "astropy",
    "ipykernel",
    "matplotlib",
    "few",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
    "sphinx-autobuild",
    "myst-parser",
    "sphinx-autodoc-typehints",
]

# Everything examples/fastlisaresponse_comparison.ipynb needs, on top of dev.
# Nothing in the package imports these: the comparison module takes the orbit
# provider and the response wrapper from its caller, so the package stays
# installable and importable without them.
#
# On macOS this install is not sufficient on its own. lisaanalysistools and
# fastlisaresponse each vendor libstdc++.6.dylib, and loading both aborts the
# interpreter. Run conventions.check_environment() for the diagnosis and fix.
comparison = [
    "fastlisaresponse",
    "lisaanalysistools",
    "matplotlib",
    "nbformat",
    "nbclient",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that build orbits and a response; deselect with -m 'not slow'",
]
